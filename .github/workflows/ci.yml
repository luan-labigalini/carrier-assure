name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  API_URL: http://localhost:${API_PORT:-5000}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 black

      - name: Run Python linter/formatter check
        run: |
          flake8 api/src api/tests
          black --check api/src api/tests

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Node dependencies
        working-directory: web
        run: |
          npm ci
          npm install --package-lock-only

      - name: Run JavaScript linter
        working-directory: web
        run: |
          npm run lint || true
          npm run format:check || true

  test-api:
    name: Test API
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install coverage

      - name: Run Python unit tests with coverage
        working-directory: api
        run: |
          coverage run -m pytest
          coverage report -m 

  test-frontend:

    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: web

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run Jest tests
        run: npm test -- --watchAll=false


  build:
    name: Build Docker Images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: |
          docker build -t lean-api:ci -f api/Dockerfile api
      - name: Build Web image
        run: |
          docker build -t lean-web:ci -f web/Dockerfile web

  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v4
      - name: Start services with docker-compose
        run: |
          docker-compose up -d --build
      - name: Wait for API to be healthy
        run: |
          for i in {1..30}; do
            if curl -sSf "$API_URL/api/health"; then
              exit 0
            fi
            sleep 2
          done
          exit 1
      - name: Smoke test /api/health
        run: |
          curl -v "$API_URL/api/health"
      - name: Tear down
        if: always()
        run: |
          docker-compose down --volumes
