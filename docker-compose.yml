#  Tool: ChatGPT and Claude
#  Prompt: "Create a performatic docker-compose.yml for a monolith project using Python as backend (on api directory) and Next.js as frontend (on web directory). The backend should use MongoDB as database."
#  Modifications: Created and analyzed the file.
#  --- END AI-ASSISTED ---

version: "3.9"

# ─────────────────────────────────────────────
# Networks
# ─────────────────────────────────────────────
networks:
  app_network:
    driver: bridge

# ─────────────────────────────────────────────
# Volumes
# ─────────────────────────────────────────────
volumes:
  mongo_data:
  mongo_config:

# ─────────────────────────────────────────────
# Services
# ─────────────────────────────────────────────

services:

  db:
    image: mongo:7
    container_name: mongo
    restart: unless-stopped
    env-file: .env
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - app_network

  # ── 2. Python API (backend) ──────────────────

  app:
    build:
      context: ./api
      dockerfile: Dockerfile
      target: ${APP_ENV:-production}
    container_name: api
    restart: unless-stopped
    env_file: .env
    environment:
      MONGO_URI: mongodb://${MONGO_ROOT_USER}:${MONGO_ROOT_PASSWORD}@db:27017/
      PORT: ${API_PORT:-5000}
      APP_ENV: ${APP_ENV:-production}
    ports:
      - "${API_PORT:-5000}:5000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${API_PORT:-5000}/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - app_network


  # ── 3. Next.js frontend ──────────────────────
  frontend:
    build:
      context: ./web
      dockerfile: Dockerfile
      target: ${APP_ENV:-production}
    container_name: frontend
    restart: unless-stopped
    env_file: .env
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
      NODE_ENV: ${APP_ENV:-production}
      API_URL: ${API_URL:-http://localhost:5000/api}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      app:
        condition: service_healthy
    networks:
      - app_network